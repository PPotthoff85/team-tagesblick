<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Team-Tagesblick · PPotthoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Stil von ppotthoff.io: Creme-Grund, Tannengrün für Kopf und Hero, Messing als Akzent,
   Newsreader (leicht, kursive Akzente) für Überschriften, Schibsted Grotesk für Text.
   Aufbau: grüner Kopf mit Personenwahl und Tagespunkten → Fokus (Top 5) → Heute vorangebracht → Gesamtüberblick (alle Karten, Team, Logbuch). */
:root{
  --cream:#f5f0e6; --cream-2:#ede6d6; --paper:#fbf8f2; --green:#22372d; --green-2:#2c4538;
  --text:#211f1a; --soft:#5a564c; --faint:#8a8576; --brass:#b0894c; --brass-2:#c9a46a; --line:#211f1a24;
  --late:#a8432c; --late-bg:#f4e2da; --today:#8a5d12; --today-bg:#f3e7cc; --soon:#2f6b4a; --soon-bg:#dfeadf;
  --f-serif:"Newsreader", Georgia, "Times New Roman", serif;
  --f-sans:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font:16px/1.5 var(--f-sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.inner{max-width:1080px;margin:0 auto;padding-inline:20px}

/* Kopf */
.top{background:var(--green);color:var(--cream)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 0}
.brand{font:400 24px/1 var(--f-serif);letter-spacing:-.01em}
.brand b{font-weight:400;color:var(--brass)}
.brand small{display:block;font:500 11px/1.6 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:#f5f0e6a6;margin-top:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:600 14px var(--f-sans);border:1px solid #f5f0e640;background:transparent;color:var(--cream);border-radius:99px;padding:7px 16px;cursor:pointer}
nav button:hover{border-color:var(--brass)}
nav button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--green)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding-block:44px 40px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font:500 13px var(--f-sans);color:var(--brass);letter-spacing:.02em}
h1{font:300 clamp(38px,6.5vw,64px)/1.04 var(--f-serif);margin:10px 0 0;letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:italic;color:var(--brass)}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--green-2);border:1px solid #f5f0e61f;border-radius:16px;padding:16px 20px;min-width:min(100%,360px)}
.ring{width:76px;height:76px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#f5f0e626}.ring .fg{stroke:var(--brass);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring text{font:400 22px var(--f-serif);fill:var(--cream);text-anchor:middle;dominant-baseline:central}
.score b{font:400 20px/1.2 var(--f-serif);display:block}
.score .sub{font-size:13px;color:#f5f0e6bf;margin-top:4px}
.week{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.week span{border:1px solid #f5f0e633;border-radius:99px;padding:1px 9px;color:#f5f0e6cc}
.week .me{border-color:var(--brass);color:var(--brass-2);font-weight:600}

/* Inhalt */
main{padding-block:40px 64px;display:grid;gap:56px}
h2{font:300 clamp(28px,4vw,38px)/1.1 var(--f-serif);margin:0 0 6px;letter-spacing:-.01em}
h2 em{font-style:italic;color:var(--brass)}
.lead{color:var(--soft);margin:0 0 20px;max-width:62ch}
.today-list{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:n}
.today-list li{counter-increment:n;display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;align-items:baseline}
.today-list li::before{content:counter(n);font:300 34px/1 var(--f-serif);color:var(--brass);grid-row:span 2}
.today-list li.done::before{content:"✓";color:var(--soon)}
.today-list li.done{background:transparent}
.today-list li.done a{text-decoration:line-through;color:var(--faint)}
.t-title{font:400 21px/1.25 var(--f-serif);text-decoration:none;overflow-wrap:anywhere}
.t-title:hover{color:var(--green-2);text-decoration:underline;text-decoration-color:var(--brass)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--soft);align-items:center}
.chip{font-weight:600;font-size:12px;letter-spacing:.02em;padding:2px 9px;border-radius:99px;background:var(--cream-2);color:var(--green)}
.due{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--cream-2);color:var(--soft);white-space:nowrap}
.due.late{background:var(--late-bg);color:var(--late)} .due.today{background:var(--today-bg);color:var(--today)} .due.soon{background:var(--soon-bg);color:var(--soon)} .due.done{background:var(--soon-bg);color:var(--soon)}
.win{background:var(--green);color:var(--cream);border-radius:16px;padding:22px 24px;margin-bottom:14px;display:grid;gap:4px}
.win strong{font:300 30px/1.15 var(--f-serif)} .win strong em{color:var(--brass);font-style:italic}
.win span{color:#f5f0e6cc}
.bonus{margin:22px 0 10px;font:italic 300 20px var(--f-serif);color:var(--soft)}

.overview{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:32px;align-items:start}
@media (max-width:900px){.overview{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:26px;min-width:0}
.grp h3{font:600 12px var(--f-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--soft);margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.grp h3 .c{color:var(--brass)}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.row a{text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.row a:hover{text-decoration:underline;text-decoration-color:var(--brass)}
.row .meta{grid-column:1/-1}
details summary{cursor:pointer;font:600 12px var(--f-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--soft);margin-bottom:10px}
details summary:hover{color:var(--green)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel h3{font:400 22px var(--f-serif);margin:0 0 12px}
.tbl{display:grid;gap:8px}
.tr{display:grid;grid-template-columns:70px repeat(4,1fr);gap:6px;align-items:center;font-size:14px}
.tr.h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.tr.h span{text-align:center}
.num{text-align:center;font:400 18px var(--f-serif);border-radius:6px;padding:1px 0}
.num.late{background:var(--late-bg);color:var(--late)} .num.today{background:var(--today-bg);color:var(--today)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.feed li{border-left:2px solid var(--brass);padding-left:12px;font-size:14px}
.feed .who{font-size:12px;color:var(--faint)}
.feed a{font-weight:600;text-decoration:none;color:var(--green)}
.feed p{margin:2px 0 0;color:var(--soft);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--soft)}
.login{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:560px;display:grid;gap:14px}
.btn{font:600 15px var(--f-sans);background:var(--brass);color:var(--green);border:0;border-radius:99px;padding:12px 22px;cursor:pointer;justify-self:start}
.btn:hover{background:var(--brass-2)}
footer{border-top:1px solid var(--line);padding-block:18px 32px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--faint)}
footer button{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;cursor:pointer;font:inherit}





/* Team-Rekorde */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:6px 8px;border-radius:8px}
.rank li.now{background:var(--today-bg)}
.rank .pos{font:400 18px var(--f-serif);color:var(--brass)}
.rank .p{font:400 20px var(--f-serif);color:var(--green)}
.rank .e{font-size:12px;color:var(--soft)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar i{display:block;width:100%;max-width:28px;background:var(--cream-2);border-radius:4px 4px 0 0}
.bar.now i{background:var(--brass)}
.bar .v{font-size:11px;color:var(--soft)} .bar .l{font-size:11px;color:var(--faint)}
/* Heute vorangebracht */
.prog{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.prog li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.prog a{text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.prog a:hover{text-decoration:underline;text-decoration-color:var(--brass)}
.prog .pts{font:400 18px var(--f-serif);color:var(--brass);white-space:nowrap}
.prog .meta{grid-column:1/-1}
.kind{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--cream-2);color:var(--green)}
.kind.done{background:var(--soon-bg);color:var(--soon)}
.lvl{display:inline-block;font:600 11px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--brass-2);margin-bottom:2px}
/* Gestern-Rubrik */
.yday{background:var(--green);color:var(--cream);border-radius:16px;padding:18px 22px;display:grid;gap:10px}
.yday-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.yday h3{font:300 24px var(--f-serif);margin:0} .yday h3 em{color:var(--brass);font-style:italic}
.yday-h span{font-size:12px;color:#f5f0e699}
.yday ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.yday li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:baseline;border-top:1px solid #f5f0e61f;padding-top:10px}
.yday li b{font:600 13px var(--f-sans);color:var(--brass-2);text-transform:uppercase;letter-spacing:.08em}
.yday li h4{margin:0 0 4px;font:500 20px/1.25 var(--f-serif);color:var(--cream)}
.yday li p{margin:0;font:italic 300 17px/1.45 var(--f-serif);color:#f5f0e6e6}
.ystat{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:12.5px;color:#f5f0e6b3}
.ychip{border:1px solid #c9a46a66;color:var(--brass-2);border-radius:999px;padding:1px 9px;font-size:12px}
.yfazit{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;border-top:1px solid #f5f0e633;padding-top:10px;font-size:14px;color:var(--cream)}
.yfazit b{font:600 11px var(--f-sans);color:var(--brass-2);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
@media (max-width:560px){.yday li,.yfazit{grid-template-columns:minmax(0,1fr);gap:4px}}
/* Rad-Wetter */
.bike{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:grid;gap:12px}
.bike-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bike-h h3{font:400 22px var(--f-serif);margin:0}
.bike-h span{font-size:12px;color:var(--faint)}
.legs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.legs{grid-template-columns:minmax(0,1fr)}}
.leg{border-top:2px solid var(--brass);padding-top:10px;display:grid;gap:6px;min-width:0}
.leg .lbl{font:600 11px var(--f-sans);text-transform:uppercase;letter-spacing:.12em;color:var(--soft)}
.leg .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.leg .big b{font:300 34px/1 var(--f-serif)}
.leg .facts{font-size:13px;color:var(--soft)}
.verdict{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;justify-self:start}
.verdict.go{background:var(--soon-bg);color:var(--soon)} .verdict.maybe{background:var(--today-bg);color:var(--today)} .verdict.no{background:var(--late-bg);color:var(--late)}
.wear{font-size:14px;color:var(--text)}
/* Glückskeks */
.cookie{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.cookie button.k{background:none;border:0;padding:0;cursor:pointer;width:96px;height:72px;position:relative}
.cookie svg{width:96px;height:72px;overflow:visible}
.cookie .half{transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-box:fill-box}
.cookie .l{transform-origin:100% 80%} .cookie .r{transform-origin:0% 80%}
.cookie.open .l{transform:rotate(-28deg) translate(-10px,4px)} .cookie.open .r{transform:rotate(28deg) translate(10px,4px)}
.cookie:not(.open) button.k:hover svg{animation:wiggle .5s ease}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.slip{font:italic 300 21px/1.35 var(--f-serif);color:var(--text)}
.slip small{display:block;font:500 12px var(--f-sans);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin-bottom:4px}
.cookie.open .slip{animation:slip .7s .25s both ease}
@keyframes slip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cookie .half,.cookie.open .slip{transition:none;animation:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="top">
  <div class="inner">
    <div class="bar">
      <div class="brand">P<b>P</b>otthoff<small>Team-Tagesblick</small></div>
      <nav id="nav" aria-label="Person"></nav>
    </div>
    <div class="hero">
      <div><div class="eyebrow" id="date"></div><h1 id="greet">Guten Tag.</h1></div>
      <div id="score" hidden></div>
    </div>
  </div>
</div>

<div class="inner">
  <main id="main"><p class="empty">Lade …</p></main>
  <footer id="foot" hidden><span id="fresh"></span><button type="button" id="reload">Aktualisieren</button><a href="https://trello.com/b/k3fIItIx/team-aufgaben" target="_blank" rel="noopener">Board öffnen</a><button type="button" id="logout">Abmelden</button></footer>
</div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
  const TRELLO_KEY = "c88c5be508ded6c9bb919e989ed54767"; // öffentlicher API-Schlüssel (Power-Up „Team Tagesblick“)
  const BOARD = "k3fIItIx", KUNDEN = "iXxM8zrq";
  const PEOPLE = ["Patrick", "Kirsten", "Jan"];
  const TZ = "Europe/Berlin", MAX = 5;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
  const dayKey = (d) => new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  const fmtDay = (d) => new Intl.DateTimeFormat("de-DE",{timeZone:TZ,weekday:"short",day:"2-digit",month:"2-digit"}).format(d);
  const today = () => dayKey(new Date());
  $("date").textContent = new Intl.DateTimeFormat("de-DE",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());

  const hm = location.hash.match(/token=([0-9a-zA-Z]+)/);
  if (hm) { store.set("trello-token", hm[1]); history.replaceState(null, "", location.pathname); }
  let token = store.get("trello-token");
  let person = store.get("tagesblick-tab");
  let cards = null, byId = {}, stats = {}, feed = null;

  // ---------- Karten aufbereiten ----------
  function bucket(list) {
    const n = (list || "").toLowerCase();
    if (n.includes("erledigt")) return "done";
    if (n.includes("später")) return "later";
    if (n.includes("wartet")) return "waiting";
    if (n.includes("review") || n.includes("rückmeldung")) return "review";
    return "work";
  }
  function personsOf(c) {
    const s = new Set((c.members || []).map((m) => String(m.fullName || "").split(" ")[0]).filter((p) => PEOPLE.includes(p)));
    if (!s.size) { const tail = String(c.name).split("—").pop(); PEOPLE.forEach((p) => tail.includes(p) && s.add(p)); }
    return [...s];
  }
  function due(c) {
    if (!c.due || c.dueComplete) return null;
    const d = new Date(c.due), k = dayKey(d), t = today(), w = dayKey(new Date(Date.now() + 7 * 864e5));
    if (k < t) return { d, cls: "late", label: "überfällig · " + fmtDay(d), rank: 0 };
    if (k === t) return { d, cls: "today", label: "heute", rank: 1 };
    if (k <= w) return { d, cls: "soon", label: fmtDay(d), rank: 2 };
    return { d, cls: "", label: fmtDay(d), rank: 3 };
  }
  function parse(c, listName) {
    const parts = String(c.name).split(" · ");
    const customer = (c.labels && c.labels[0] && c.labels[0].name) || (parts.length > 1 ? parts[0] : "");
    const title = (parts.length > 1 ? parts.slice(1).join(" · ") : c.name).replace(/\s+—\s+[^—]*$/, "");
    return { id: c.id, title, customer, url: c.shortUrl, list: listName || "", persons: personsOf(c), bucket: bucket(listName), due: due(c), dueComplete: !!c.dueComplete, activity: new Date(c.dateLastActivity || 0) };
  }
  const byDue = (a, b) => (a.due ? a.due.d : Infinity) - (b.due ? b.due.d : Infinity);

  // Top 5: überfällig, heute, nächste 7 Tage; aufgefüllt mit „In Arbeit“ (Karten mit späterem Termin zuerst, dann zuletzt bearbeitete).
  function top(p) {
    const mine = cards.filter((c) => c.persons.includes(p) && c.bucket === "work");
    const urgent = mine.filter((c) => c.due && c.due.rank <= 2).sort((a, b) => a.due.rank - b.due.rank || a.due.d - b.due.d);
    const rest = mine.filter((c) => !c.due || c.due.rank > 2).sort((a, b) => (a.due ? 0 : 1) - (b.due ? 0 : 1) || (a.due && b.due ? a.due.d - b.due.d : b.activity - a.activity));
    return [...urgent, ...rest].slice(0, MAX);
  }

  // ---------- Tagesziel ----------
  function goalFor(p) {
    const k = `ziel-${p}-${today()}`;
    let ids = null; try { ids = JSON.parse(store.get(k) || "null"); } catch (e) {}
    if (!ids) { ids = top(p).map((c) => c.id); if (ids.length) store.set(k, JSON.stringify(ids)); }
    return ids;
  }
  const isDone = (id) => { const c = byId[id]; return !c || c.bucket === "done" || c.dueComplete; };

  function ring(points, frac) {
    const r = 32, C = 2 * Math.PI * r, f = Math.max(0.04, Math.min(1, frac));
    return `<svg class="ring" viewBox="0 0 76 76" role="img" aria-label="${points} Punkte heute"><circle class="bg" cx="38" cy="38" r="${r}"/><circle class="fg" cx="38" cy="38" r="${r}" transform="rotate(-90 38 38)" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - f)}"/><text x="38" y="34">${points}</text><text x="38" y="52" style="font:600 9px var(--f-sans);letter-spacing:.08em;fill:#f5f0e6a6">PUNKTE</text></svg>`;
  }
  // Konfetti beim Erreichen einer neuen Stufe (einmal pro Stufe und Tag)
  function levelUp(p, i) {
    const k = `stufe-${p}-${today()}`, prev = Number(store.get(k) || 0);
    if (i > prev) { store.set(k, String(i)); if (prev > 0 || i >= 2) confetti(); }
    else if (!store.get(k)) store.set(k, String(i));
  }
  function greeting() { const h = parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",hourCycle:"h23"}).format(new Date()), 10); return h < 11 ? "Guten Morgen" : h < 17 ? "Hallo" : "Guten Abend"; }

    return `<div class="yday"><div class="yday-h"><h3>Was gestern <em>los war.</em></h3><span>Tagesblick-Kurier · ${esc(yday.label)} · frei nach Trello, nicht ganz ernst gemeint</span></div><ul>${PEOPLE.map((p) => { const x = yday.people[p]; return `<li><b>${p}</b><div><h4>${esc(x.head)}</h4><p>${esc(x.text)}</p>${x.stat || x.chips.length ? `<div class="ystat">${x.chips.map((c) => `<span class="ychip">${esc(c)}</span>`).join("")}${x.stat ? `<span>${esc(x.stat)}</span>` : ""}</div>` : ""}</div></li>`; }).join("")}</ul><div class="yfazit"><b>Team-Fazit</b><span>${esc(yday.fazit)}</span></div></div>`;
  }



  // ---------- Fortschritt heute ----------
  // Nur Team-Wertung: alle Punkte zählen gemeinsam, egal wer die Karte bewegt. Kommentare zählen nicht.
  const LEVELS = [[0, "Startklar"], [15, "Warmgelaufen"], [40, "Im Flow"], [80, "Durchstarter"], [130, "Maschine"], [200, "Legende"]];
  let progress = {}, teamProg = { points: 0, done: 0, cards: 0, list: [] };
  function levelOf(pts) {
    let i = 0; LEVELS.forEach(([min], k) => { if (pts >= min) i = k; });
    const [min, name] = LEVELS[i], next = LEVELS[i + 1];
    return { i, name, min, next: next ? next[0] : null, nextName: next ? next[1] : null };
  }
  // Punkte je Karte und Tag aus Trello-Aktionen (gleiche Regeln für Person und Team)
  function scoreAction(a) {
    const d = a.data || {}, card = d.card || {};
    if (a.type === "createCard") return ["neu angelegt", 2];
    if (d.listAfter) { const to = String(d.listAfter.name || "").toLowerCase(); return to.includes("erledigt") ? ["erledigt", 10] : to.includes("später") ? ["geparkt", 1] : ["weitergebracht", 3]; }
    if (d.old && "dueComplete" in d.old && card.dueComplete) return ["erledigt", 10];
    if (d.old && "closed" in d.old) return ["aufgeräumt", 3];
    if (d.old && "due" in d.old) return ["Termin gesetzt", 2];
    return null;
  }
  let teamDays = []; // [{day, points, done}]
  async function loadProgress() {
    const since = new Date(Date.now() - 45 * 864e5); since.setHours(0, 0, 0, 0);
    let acts = [], before = null;
    for (let i = 0; i < 5; i++) { // bis zu 5000 Aktionen
      const page = await api(`/boards/${BOARD}/actions`, { filter: "updateCard,createCard", since: since.toISOString(), limit: "1000", ...(before ? { before } : {}) });
      acts = acts.concat(page);
      if (page.length < 1000) break;
      before = page[page.length - 1].id;
    }
    const byDay = {}; // day -> cardId -> {name,url,kinds,pts}
    for (const a of acts) {
      const card = (a.data || {}).card || {}; if (!card.id) continue;
      const sc = scoreAction(a); if (!sc) continue;
      const day = dayKey(new Date(a.date));
      const m = byDay[day] || (byDay[day] = {});
      const c = m[card.id] || (m[card.id] = { name: card.name || "", url: "https://trello.com/c/" + (card.shortLink || ""), kinds: new Set(), pts: 0 });
      c.kinds.add(sc[0]);
      c.pts = Math.min(10, Math.max(c.pts, sc[1]) + (c.kinds.size > 1 ? 1 : 0)); // höchstens 10 Punkte pro Karte und Tag
    }
    teamDays = Object.entries(byDay).map(([day, m]) => ({ day, points: Object.values(m).reduce((x, c) => x + c.pts, 0), done: Object.values(m).filter((c) => c.kinds.has("erledigt")).length }));
    const todayMap = byDay[today()] || {};
    const res = Object.fromEntries(PEOPLE.map((p) => [p, { points: 0, done: 0, cards: {} }]));
    teamProg = { points: 0, done: 0, cards: 0, list: [] };
    for (const [id, c] of Object.entries(todayMap)) {
      const owners = byId[id] ? byId[id].persons : PEOPLE.filter((p) => String(c.name).split("—").pop().includes(p));
      const isDone = c.kinds.has("erledigt");
      teamProg.points += c.pts; teamProg.cards++; if (isDone) teamProg.done++; teamProg.list.push({ ...c, owners });
      for (const p of owners) { const r = res[p]; r.cards[id] = c; r.points += c.pts; if (isDone) r.done++; }
    }
    progress = res;
  }
  function teamBoardHtml() {
    if (!teamDays.length) return "";
    const ranked = [...teamDays].sort((x, y) => y.points - x.points || y.done - x.done);
    const t = today(), rank = ranked.findIndex((d) => d.day === t) + 1;
    const fmt = (k) => new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }).format(new Date(k + "T12:00:00"));
    const max = Math.max(...teamDays.map((d) => d.points), 1);
    const recent = [...teamDays].sort((x, y) => x.day.localeCompare(y.day)).slice(-14);
    const medal = ["🥇", "🥈", "🥉"];
    const isRecord = rank === 1 && teamDays.length >= 3 && (teamDays.find((d) => d.day === t) || {}).points > 0;
    if (isRecord && !store.get(`rekord-${t}`)) { store.set(`rekord-${t}`, "1"); confetti(); }
    const todayLine = rank ? (rank === 1 ? (teamDays.length >= 3 ? "Heute ist bisher euer <b>bester Team-Tag</b>." : "Heute führt die noch junge Bestenliste an.") : `Heute steht ihr gerade auf <b>Platz ${rank}</b> von ${ranked.length} Tagen.`) : "Heute ist noch nichts bewegt worden. Die Liste wartet.";
    return `<section><h2>Team-<em>Rekorde.</em></h2><p class="lead">Die besten Tage, an denen ihr drei gemeinsam am meisten vorangebracht habt. ${todayLine}</p>
      <div class="two">
        <div class="panel"><h3>Bestenliste</h3><ol class="rank">${ranked.slice(0, 5).map((d, i) => `<li class="${d.day === t ? "now" : ""}"><span class="pos">${medal[i] || i + 1}</span><span class="d">${esc(fmt(d.day))}${d.day === t ? " · heute" : ""}</span><span class="p">${d.points}</span><span class="e">${d.done} erledigt</span></li>`).join("")}</ol></div>
        <div class="panel"><h3>Letzte Tage</h3><div class="bars">${recent.map((d) => `<div class="bar ${d.day === t ? "now" : ""}" title="${esc(fmt(d.day))}: ${d.points} Punkte, ${d.done} erledigt"><span class="v">${d.points}</span><i style="height:${Math.max(4, Math.round(d.points / max * 100))}%"></i><span class="l">${esc(fmt(d.day).slice(0, 2))}</span></div>`).join("")}</div></div>
      </div></section>`;
  }
  function teamStreak() {
    const done = new Set(teamDays.filter((d) => d.done > 0).map((d) => d.day));
    const d = new Date(); let n = 0;
    if (!done.has(dayKey(d))) d.setDate(d.getDate() - 1);
    for (let i = 0; i < 60; i++) {
      const wd = d.getDay();
      if (wd !== 0 && wd !== 6) { if (done.has(dayKey(d))) n++; else break; }
      d.setDate(d.getDate() - 1);
    }
    return n;
  }
  function teamRank() {
    const t = today(); if (!teamDays.some((d) => d.day === t)) return 0;
    return [...teamDays].sort((x, y) => y.points - x.points || y.done - x.done).findIndex((d) => d.day === t) + 1;
  }
  function progressList() {
    const items = [...teamProg.list].sort((a, b) => b.pts - a.pts);
    const head = `<section><h2>Heute gemeinsam <em>vorangebracht.</em></h2><p class="lead">Alles, was im Team heute ein Stück weitergekommen ist. Jede Karte zählt fürs Team: erledigt 10 Punkte, weitergebracht oder aufgeräumt 3, neuer Termin oder neue Karte 2.</p>`;
    if (!items.length) return head + `<p class="empty">Der Tag ist noch jung. Jede Karte, die heute weiterkommt, landet hier und bringt dem Team Punkte.</p></section>`;
    return head + `<ul class="prog">${items.map((c) => { const parts = String(c.name).split(" · "); const cust = parts.length > 1 ? parts[0] : ""; const title = (parts.length > 1 ? parts.slice(1).join(" · ") : c.name).replace(/\s+—\s+[^—]*$/, ""); return `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(title)}</a><span class="pts">+${c.pts}</span><div class="meta">${cust ? `<span class="chip">${esc(cust)}</span>` : ""}${c.owners && c.owners.length ? `<span>${esc(c.owners.join(", "))}</span>` : ""}${[...c.kinds].map((k) => `<span class="kind ${k === "erledigt" ? "done" : ""}">${k === "erledigt" ? "✓ erledigt" : esc(k)}</span>`).join("")}</div></li>`; }).join("")}</ul></section>`;
  }

  // ---------- Rendern ----------
  function renderNav() {
    $("nav").innerHTML = PEOPLE.map((p) => `<button type="button" aria-pressed="${p === person}" data-p="${p}">${p}</button>`).join("");
    $("nav").querySelectorAll("button").forEach((b) => b.onclick = () => { person = b.dataset.p; store.set("tagesblick-tab", person); render(); });
  }

  function todayItem(c, closed) {
    const others = (c.persons || []).filter((x) => x !== person);
    return `<li class="${closed ? "done" : ""}"><a class="t-title" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a><div class="meta">${c.customer ? `<span class="chip">${esc(c.customer)}</span>` : ""}${closed ? `<span class="due done">erledigt</span>` : `<span class="due ${c.due ? c.due.cls : ""}">${esc(c.due ? c.due.label : "ohne Termin")}</span>`}${others.length ? `<span>mit ${esc(others.join(", "))}</span>` : ""}</div></li>`;
  }
  function row(c, showList) {
    const others = c.persons.filter((x) => x !== person);
    return `<div class="row"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a><span class="due ${c.due ? c.due.cls : ""}">${esc(c.due ? c.due.label : "ohne Termin")}</span><div class="meta">${c.customer ? `<span class="chip">${esc(c.customer)}</span>` : ""}${others.length ? `<span>mit ${esc(others.join(", "))}</span>` : ""}${showList ? `<span>${esc(c.list.replace(/^[^\p{L}]+/u, ""))}</span>` : ""}</div></div>`;
  }
  function grp(title, items, showList) {
    if (!items.length) return "";
    return `<section class="grp"><h3>${esc(title)} <span class="c">${items.length}</span></h3><div class="rows">${items.map((c) => row(c, showList)).join("")}</div></section>`;
  }
  function counts(p) {
    const mine = cards.filter((c) => c.persons.includes(p) && c.bucket !== "done" && c.bucket !== "later");
    return { late: mine.filter((c) => c.due && c.due.cls === "late").length, today: mine.filter((c) => c.due && c.due.cls === "today").length, waiting: mine.filter((c) => c.bucket === "waiting").length, open: mine.length };
  }

  function render() {
    renderNav();
    if (!cards || !person) return;
    const ids = goalFor(person);
    const goal = ids.map((id) => byId[id] || { id, title: "Karte archiviert", customer: "", url: "#", persons: [], due: null });
    const done = ids.filter(isDone).length, total = ids.length, won = total > 0 && done === total;

    // Kopf: nur Team-Wertung
    const lv = levelOf(teamProg.points), streak = teamStreak(), rk = teamRank();
    const frac = lv.next ? (teamProg.points - lv.min) / (lv.next - lv.min) : 1;
    $("greet").innerHTML = (won || lv.i >= 3) ? `Starker Tag, <em>${esc(person)}.</em>` : `${greeting()}, <em>${esc(person)}.</em>`;
    $("score").hidden = false;
    $("score").innerHTML = `<div class="score">${ring(teamProg.points, frac)}<div><span class="lvl">Team-Stufe ${lv.i + 1} · ${esc(lv.name)}</span><b>${teamProg.cards ? `Team heute: ${teamProg.cards} ${teamProg.cards === 1 ? "Karte" : "Karten"} weitergebracht${teamProg.done ? `, ${teamProg.done} erledigt` : ""}` : "Team bereit für den ersten Schritt"}</b><div class="sub">${lv.next ? `Nächste Team-Stufe „${esc(lv.nextName)}“ ab ${lv.next} Punkten` : "Höchste Team-Stufe erreicht"}${streak ? ` · 🔥 ${streak} ${streak === 1 ? "Arbeitstag" : "Arbeitstage"} in Folge mit Erledigtem` : ""}</div>${rk ? `<div class="week"><span class="me">${rk === 1 && teamDays.length >= 3 ? "Bester Team-Tag bisher" : `Platz ${rk} von ${teamDays.length} Team-Tagen`}</span></div>` : ""}</div></div>`;
    levelUp("team", lv.i);

    // Heute
    const open = goal.filter((c) => !isDone(c.id)), closed = goal.filter((c) => isDone(c.id));
    let html = `<div style="display:grid;gap:14px">${cookieHtml(person)}${bikeHtml()}${padelHtml()}${ydayHtml()}</div>` + `<section><h2>Fokus <em>für heute.</em></h2><p class="lead">Die Themen mit dem meisten Schwung für heute. Was in Trello auf „Erledigt“ landet, wird hier abgehakt und bringt dem Team 10 Punkte.</p>`;
    if (won) { html += `<div class="win"><strong>Stark, <em>${esc(person)}</em>. Alle Fokus-Themen erledigt.</strong><span>Was jetzt noch kommt, ist Bonus fürs Team.</span></div>`; celebrate(person); }
    html += total ? `<ol class="today-list">${open.map((c) => todayItem(c, false)).join("")}${closed.map((c) => todayItem(c, true)).join("")}</ol>` : `<p class="empty">Nichts Offenes in „In Arbeit“. Schau im Board, ob etwas zugeteilt werden muss.</p>`;
    if (won) { const next = top(person).filter((c) => !ids.includes(c.id)).slice(0, 3); if (next.length) html += `<p class="bonus">Bonus, falls noch Luft ist</p><ol class="today-list">${next.map((c) => todayItem(c, false)).join("")}</ol>`; }
    html += `</section>` + progressList() + teamBoardHtml();

    // Gesamtüberblick
    const mine = cards.filter((c) => c.persons.includes(person));
    const active = mine.filter((c) => c.bucket !== "done" && c.bucket !== "later");
    const dated = active.filter((c) => c.bucket !== "waiting");
    const g = {
      late: dated.filter((c) => c.due && c.due.cls === "late").sort(byDue),
      today: dated.filter((c) => c.due && c.due.cls === "today"),
      soon: dated.filter((c) => c.due && c.due.cls === "soon").sort(byDue),
      later: dated.filter((c) => c.due && c.due.cls === "").sort(byDue),
      waiting: active.filter((c) => c.bucket === "waiting").sort(byDue),
      noDue: active.filter((c) => !c.due && c.bucket !== "waiting"),
      parked: mine.filter((c) => c.bucket === "later"),
    };
    let left = grp("Überfällig", g.late) + grp("Heute fällig", g.today) + grp("Nächste 7 Tage", g.soon);
    if (person === "Patrick") {
      left += grp("Zur Rückmeldung / Review", cards.filter((c) => c.bucket === "review"));
      left += grp("Noch niemandem zugeteilt", cards.filter((c) => !c.persons.length && c.bucket !== "done"), true);
    }
    left += grp("Wartet auf Kunde", g.waiting) + grp("Später fällig", g.later);
    if (g.noDue.length) left += `<details><summary>In Arbeit ohne Termin (${g.noDue.length})</summary><div class="rows">${g.noDue.map((c) => row(c)).join("")}</div></details>`;
    if (g.parked.length) left += `<details><summary>Geparkt in „Später“ (${g.parked.length})</summary><div class="rows">${g.parked.map((c) => row(c)).join("")}</div></details>`;
    if (!left) left = `<p class="empty">Keine offenen Karten für ${esc(person)}.</p>`;

    const team = `<div class="tbl"><div class="tr h"><span></span><span>überfällig</span><span>heute</span><span>wartet</span><span>offen</span></div>${PEOPLE.map((p) => { const n = counts(p); return `<div class="tr"><b>${p}</b><span class="num ${n.late ? "late" : ""}">${n.late}</span><span class="num ${n.today ? "today" : ""}">${n.today}</span><span class="num">${n.waiting}</span><span class="num">${n.open}</span></div>`; }).join("")}</div>`;
    const fd = feed === null ? `<p class="empty">Wird geladen …</p>` : feed.length ? `<ul class="feed">${feed.slice(0, 10).map((a) => `<li><div class="who">${esc(fmtDay(new Date(a.date)))} · ${esc(a.who)}</div><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.card)}</a><p>${esc(a.text)}</p></li>`).join("")}</ul>` : `<p class="empty">Noch keine Logbuch-Einträge.</p>`;

    html += `<section><h2>Gesamt<em>überblick.</em></h2><p class="lead">Alle offenen Karten von ${esc(person)}, dazu der Stand im Team und das Kunden-Logbuch.</p><div class="overview"><div class="col">${left}</div><aside class="col"><div class="panel"><h3>Wer hat was</h3>${team}</div><div class="panel"><h3>Kunden-Logbuch</h3>${fd}</div></aside></div></section>`;
    $("main").innerHTML = html;
    wireCookie(person);
  }

  // Konfetti einmal pro Person und Tag
  function celebrate(p) {
    const k = `gefeiert-${p}-${today()}`;
    if (store.get(k)) return; store.set(k, "1");
    confetti();
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("confetti"), ctx = cv.getContext("2d"); cv.hidden = false;
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
    const cols = ["#b0894c", "#c9a46a", "#22372d", "#2f6b4a", "#ede6d6"];
    const parts = Array.from({ length: 150 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.3, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 11 - 3, s: 5 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach((q) => { q.vy += 0.28; q.x += q.vx; q.y += q.vy; q.r += 0.1; ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillStyle = q.c; ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore(); });
      if (++t < 170) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    })();
  }

  // ---------- Trello ----------
  async function api(path, params) {
    const r = await fetch(`https://api.trello.com/1${path}?` + new URLSearchParams({ ...params, key: TRELLO_KEY, token }));
    if (r.status === 401) { const e = new Error("401"); e.code = 401; throw e; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  // Wer hat wann Karten nach „Erledigt“ gebracht: Serie (Arbeitstage in Folge), heute, diese Woche
  async function loadStats() {
    const since = new Date(Date.now() - 21 * 864e5).toISOString();
    const acts = await api(`/boards/${BOARD}/actions`, { filter: "updateCard:idList", since, limit: "1000", fields: "data,date", memberCreator: "false" });
    const days = Object.fromEntries(PEOPLE.map((p) => [p, new Set()]));
    const cnt = Object.fromEntries(PEOPLE.map((p) => [p, { today: 0, week: 0 }]));
    const seen = new Set(), t = today();
    const monday = new Date(); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    for (const a of acts) {
      const after = (a.data && a.data.listAfter && a.data.listAfter.name) || "";
      if (!after.toLowerCase().includes("erledigt")) continue;
      const cid = a.data.card && a.data.card.id; if (!cid || seen.has(cid)) continue; seen.add(cid);
      const who = byId[cid] ? byId[cid].persons : PEOPLE.filter((p) => String(a.data.card.name || "").split("—").pop().includes(p));
      const d = new Date(a.date), k = dayKey(d);
      for (const p of who) { days[p].add(k); if (k === t) cnt[p].today++; if (d >= monday) cnt[p].week++; }
    }
    for (const p of PEOPLE) {
      let streak = 0; const d = new Date();
      if (!days[p].has(dayKey(d))) d.setDate(d.getDate() - 1);
      for (let i = 0; i < 21; i++) { const wd = d.getDay(); if (wd !== 0 && wd !== 6) { if (days[p].has(dayKey(d))) streak++; else break; } d.setDate(d.getDate() - 1); }
      stats[p] = { ...cnt[p], streak };
    }
  }

  async function load() {
    try {
      const [lists, raw] = await Promise.all([
        api(`/boards/${BOARD}/lists`, { fields: "name" }),
        api(`/boards/${BOARD}/cards`, { fields: "name,due,dueComplete,idList,labels,shortUrl,dateLastActivity", members: "true", member_fields: "fullName" }),
      ]);
      const ln = Object.fromEntries(lists.map((l) => [l.id, l.name]));
      cards = raw.filter((c) => !String(c.name).startsWith("ℹ️")).map((c) => parse(c, ln[c.idList]));
      byId = Object.fromEntries(cards.map((c) => [c.id, c]));
      try { await loadStats(); } catch (e) { stats = {}; }
      try { await loadProgress(); } catch (e) { progress = {}; }
      if (yday === null) loadYesterday();
      $("foot").hidden = false;
      $("fresh").textContent = "Stand " + new Intl.DateTimeFormat("de-DE",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date()) + " Uhr";
      render();
    } catch (e) {
      if (e.code === 401) { store.del("trello-token"); token = null; return login("Die Trello-Anmeldung ist abgelaufen. Bitte neu verbinden."); }
      $("main").innerHTML = `<p class="empty">Trello ist gerade nicht erreichbar (${esc(e.message)}). Bitte später „Aktualisieren“.</p>`;
      return;
    }
    api(`/boards/${KUNDEN}/actions`, { filter: "commentCard", limit: "20", memberCreator_fields: "fullName" })
      .then((acts) => { feed = acts.map((a) => ({ date: a.date, who: String((a.memberCreator && a.memberCreator.fullName) || "").split(" ")[0], card: a.data && a.data.card && a.data.card.name, url: "https://trello.com/c/" + (a.data && a.data.card && a.data.card.shortLink), text: String((a.data && a.data.text) || "").replace(/\*\*/g, "").replace(/^📓\s*/, "") })); render(); })
      .catch(() => { feed = []; render(); });
  }

  function login(msg) {
    $("foot").hidden = true; $("nav").innerHTML = ""; $("score").hidden = true;
    $("greet").innerHTML = `Was heute <em>zählt.</em>`;
    $("main").innerHTML = `<div class="login"><div>${esc(msg || "Einmal mit Trello verbinden, dann siehst du hier jeden Tag deine wichtigsten Aufgaben, deine Fortschritte und den Stand im Team. Die Anmeldung bleibt in diesem Browser gespeichert.")}</div><button class="btn" id="login" type="button">Mit Trello verbinden</button></div>`;
    $("login").onclick = () => { location.href = "https://trello.com/1/authorize?" + new URLSearchParams({ expiration: "never", name: "Team-Tagesblick", scope: "read", response_type: "token", key: TRELLO_KEY, return_url: location.origin + location.pathname, callback_method: "fragment" }); };
  }

  async function boot() {
    if (!token) return login();
    if (!person) {
      try { const me = await api("/members/me", { fields: "fullName" }); const f = String(me.fullName || "").split(" ")[0]; if (PEOPLE.includes(f)) person = f; }
      catch (e) { if (e.code === 401) { store.del("trello-token"); token = null; return login(); } }
      person = person || "Patrick";
    }
    renderNav(); load();
  }
  $("reload").onclick = () => token && load();
  $("logout").onclick = () => { store.del("trello-token"); token = null; cards = null; login(); };
  setInterval(() => token && document.visibilityState === "visible" && load(), 10 * 60 * 1000);
  boot();
  loadWeather();
  setInterval(loadWeather, 30 * 60 * 1000);
})();
</script>
</body>
</html>
